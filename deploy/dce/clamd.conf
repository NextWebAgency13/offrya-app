# OFFRYA DCE: socket only, not reachable over Render public/private TCP.
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
User clamav
Foreground yes
MaxThreads 2
MaxQueue 4
MaxScanSize 45M
MaxFileSize 9M
MaxRecursion 6
MaxFiles 120
StreamMaxLength 21M
ReadTimeout 28
CommandReadTimeout 28
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
SelfCheck 3600
