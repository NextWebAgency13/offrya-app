name: OFFRYA — Agent de qualité visuelle

on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit (captures uniquement) ou propose (correctifs CSS en PR)'
        type: choice
        options: [audit, propose]
        default: audit
      route_filter:
        description: 'Optionnel : filtrer les pages (ex. deposer-une-mission)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: offrya-visual-agent
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les outils de test (hors production)
        run: npm install --include=dev --no-audit --no-fund
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Demarrer OFFRYA de test sans action sur la production
        env:
          PORT: '4199'
          NODE_ENV: test
        run: |
          node server.js > /tmp/offrya-visual-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4199/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/offrya-visual-server.log
          exit 1
      - name: Capturer et analyser toutes les pages
        env:
          OFFRYA_VISUAL_BASE_URL: https://offrya.fr
          OFFRYA_VISUAL_OPENAI_API_KEY: ${{ secrets.OFFRYA_VISUAL_OPENAI_API_KEY }}
          OFFRYA_VISUAL_MODEL: ${{ vars.OFFRYA_VISUAL_MODEL || 'gpt-4.1-mini' }}
          OFFRYA_VISUAL_AI_LIMIT: '8'
          OFFRYA_VISUAL_ROUTE_FILTER: ${{ inputs.route_filter }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "propose" ]; then
            OFFRYA_VISUAL_BASE_URL=http://127.0.0.1:4199 npm run visual:propose
          else
            npm run visual:audit
          fi
      - name: Archiver les captures et les rapports visuels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offrya-audit-visuel
          path: visual-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Creer une PR de corrections pour revue humaine
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'propose'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.VISUAL_BOT_PR_TOKEN || github.token }}
          add-paths: public/visual-agent-fixes.css
          branch: bot/offrya-visual-agent
          delete-branch: true
          title: 'OFFRYA — proposition de corrections visuelles automatiques'
          body: |
            Correctifs CSS proposes par l agent visuel.

            Consulter l artefact offrya-audit-visuel du workflow :
            captures AVANT/APRES, mesures et rapport detaille.

            Ne pas fusionner sans validation Android + ordinateur.
            L agent ne modifie ni la logique metier ni les permissions.
          commit-message: 'style(visual): proposer ajustements de lisibilite verifies'
