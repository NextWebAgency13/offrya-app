name: OFFRYA — veille sectorielle des marchés publics
on:
  push:
    branches: [main]
    paths:
      - 'scripts/watch-sector-tenders.js'
      - 'lib/ted.js'
      - 'lib/tender-assistant.js'
      - '.github/workflows/sector-tender-watch.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offrya-sector-tenders-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.OFFRYA_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.OFFRYA_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Veille BOAMP + TED : opportunités publiques pour abonnés vérifiés
        run: node scripts/watch-sector-tenders.js
