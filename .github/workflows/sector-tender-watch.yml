name: OFFRYA — veille sectorielle des marchés publics
on:
  push:
    branches: [main]
    paths:
      - 'scripts/watch-sector-tenders.js'
      - 'lib/ted.js'
      - 'lib/boamp.js'
      - 'lib/approch.js'
      - 'sql/automatic_premium_watch.sql'
      - 'lib/tender-assistant.js'
      - '.github/workflows/sector-tender-watch.yml'
  schedule:
    # Toutes les 6 heures (00:23, 06:23, 12:23, 18:23 UTC) : les marchés publics ne changent pas à l'heure.
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offrya-sector-tenders-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.OFFRYA_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.OFFRYA_SUPABASE_SECRET_KEY }}
      # APProch : mettre la variable à true après la migration sql/approch_opportunity_source.sql.
      OFFRYA_APPROCH_ENABLED: ${{ vars.OFFRYA_APPROCH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Veille BOAMP + TED + APProch : opportunités publiques pour abonnés vérifiés"
        run: node scripts/watch-sector-tenders.js
