name: OFFRYA — Import Pexels en branche de revue (sans production)

on:
  push:
    branches:
      - fix/assets-cache-seo-20261102-review
    paths:
      - .github/workflows/vendor-pexels-review.yml

permissions:
  contents: write

jobs:
  vendor-local-photos:
    if: github.ref == 'refs/heads/fix/assets-cache-seo-20261102-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download each existing Pexels JPEG without retouching
        run: node scripts/vendor-pexels-images.cjs --apply
      - name: Verify all local photo hashes and original layout
        run: |
          npm test
          git diff --check
          test -f public/images/manifest.json
          test "$(find public/images -maxdepth 1 -name '*.jpg' | wc -l)" -eq 15
          ! grep -q 'images.pexels.com' public/public.css
      - name: Commit assets to the PR branch only
        env:
          GIT_BRANCH: fix/assets-cache-seo-20261102-review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images public/public.css public/index.html public/connexion.html public/professionnels.html public/deposer-une-mission.html public/secteurs/*.html server.js
          git diff --cached --check
          git diff --cached --quiet && { echo "Nothing to commit"; exit 1; }
          git commit -m "perf(images): héberger localement les mêmes JPEG Pexels (15 fichiers)"
          git push origin HEAD:refs/heads/"$GIT_BRANCH"

# Nouvelle tentative : test du sélecteur corrigé avant intégration.
