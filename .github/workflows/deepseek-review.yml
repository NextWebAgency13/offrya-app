name: OFFRYA — revue de code DeepSeek (manuelle)
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Numéro de la pull request à analyser
        type: number
        required: true
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: offrya-deepseek-review-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'NextWebAgency13/offrya-app'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analyser la PR avec DeepSeek sans modifier le dépôt
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node scripts/deepseek-pr-review.js
